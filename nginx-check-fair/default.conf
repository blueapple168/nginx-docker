# =====================================================================
# 业务示例: upstream 主动健康检查 (check) + 忙闲感知调度 (fair)
#
# 注意事项:
#   1. `fair;` 必须单独成行, 放在 upstream 内所有 server 行之后
#   2. check 指令同样放在 upstream 块内 (所有 server 之后亦可)
#   3. fair 使用的是 Akvicor 维护版模块, 与 yaoweibin check 模块各自独立
#      维护节点状态; check 负责流量摘除, fair 负责调度策略
#   4. server 行不要加 weight (fair 会按忙闲自动调度, 加 weight 无意义)
# =====================================================================

# 主动健康检查状态页 (运维观测用, 默认仅本机, 建议按需加 allow 收紧)
server {
    listen 127.0.0.1:8081;
    location /check_status {
        check_status;
        access_log off;
        # allow 10.0.0.0/8; deny all;
    }
}

# 业务 upstream 示例: HTTP 主动健康检查 + fair 调度
upstream biz_backend {
    server 10.0.0.11:8000;
    server 10.0.0.12:8000;
    server 10.0.0.13:8000;

    # 主动健康检查: 每 3s 发一次 HTTP 探测, 连续 2 次成功视为 up,
    # 连续 3 次失败视为 down, 探测超时 1s
    check interval=3000 rise=2 fall=3 timeout=1000 type=http;
    check_http_send "GET /health HTTP/1.0\r\nHost: $proxy_host\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;

    # 忙闲感知调度: 优先把请求分给当前处理请求数最少的后端
    fair;
}

server {
    listen 8080;
    server_name  localhost;

    location / {
        proxy_pass http://biz_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与主动健康检查协同: 探测间隙内的失败请求转投下一节点兜底
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
