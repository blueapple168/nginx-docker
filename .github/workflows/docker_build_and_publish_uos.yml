# =====================================================================
# 信创 (UOS) nginx stable 镜像专用构建与发布 workflow
#
# 结构参考 kafka 的 docker_build_and_publish_uos.yml:
#   - matrix variant × platform: 2 个变体 × 2 个平台 = 4 个独立 job, 互不 cancel
#       stable : nginx-stable/Dockerfile       ->  ${NGINX_VERSION}-uos
#       otel   : nginx-stable-otel/Dockerfile  ->  ${NGINX_VERSION}-otel-uos
#   - arm64 使用原生 ubuntu-24.04-arm runner (public 仓库免费), 不走 QEMU 模拟
#   - 单平台 job 各自推 ${tag}-<arch>, 最后由 merge-manifest job 合成 multi-arch manifest
#   - Trivy CVE 扫描 (仅出报告, 不阻断发布)
#
# 镜像仓库: ghcr.io/blueapple168/nginx
#   stable 变体: <VER>-uos           + 浮动 tag latest
#   otel   变体: <VER>-otel-uos      + 浮动 tag otel-latest
#
# 触发:
#   1) schedule 每天 02:00 UTC 检测 nginx 官方 stable 是否有新版本
#   2) workflow_dispatch 手动触发 (可指定 nginx_version 强制版本 / force_build 跳过 tag 检查)
#   3) push 到 main 分支且 Dockerfile/配置/workflow 文件变更
#
# 版本判定: 只跟踪 nginx 官方 Stable 分支 (严格解析 download.html 的 "Stable version" 区块,
#           显式排除 Mainline/Legacy), 并校验官方 stable yum 仓库双架构 rpm (含 otel 模块) 齐全;
#           用 git tag nginx-v<版本> 标记已构建版本, 新 Stable 版本才构建, 成功后自动打 tag 闭环。
# =====================================================================
name: Docker Build and Publish (UOS nginx)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "强制使用的 nginx stable 版本 (如 1.30.6), 留空自动检测最新 stable"
        required: false
        default: ""
      force_build:
        description: "强制构建 (忽略已构建 tag 检查, 用于重推同版本镜像)"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "nginx-stable/**"
      - "nginx-stable-otel/**"
      - ".github/workflows/docker_build_and_publish_uos.yml"

permissions:
  contents: write    # tag-release job 打/推 git tag
  packages: write    # 推送 GHCR 镜像

env:
  # nginx 镜像仓库集中维护; 变体 tag 后缀在 matrix.include 中定义
  IMAGE_REPO: ghcr.io/blueapple168/nginx

jobs:
  # ------------------------------------------------------------------
  # 1. 检测 nginx 官方最新 stable 版本, 决定是否需要构建
  # ------------------------------------------------------------------
  detect:
    name: Detect latest nginx stable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
      build_stable: ${{ steps.ver.outputs.build_stable }}
      build_otel: ${{ steps.ver.outputs.build_otel }}
      build_check_fair: ${{ steps.ver.outputs.build_check_fair }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve nginx stable version (official Stable only)
        id: ver
        env:
          INPUT_VER: ${{ inputs.nginx_version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VER}" ]; then
            VER="${INPUT_VER}"
            echo "使用手动指定版本: ${VER}"
          else
            # 只跟踪 nginx 官方 Stable 分支：
            # 从 https://nginx.org/en/download.html 的 "Stable version" 区块严格解析版本号。
            # 注意页面结构: Mainline 在 Stable 之前、Legacy 在 Stable 之后，
            # 逐行扫描并在命中锚点后截取到下一个 <h4> 为止，保证不会误取 Mainline/Legacy。
            curl -fsSL --retry 3 https://nginx.org/en/download.html -o /tmp/download.html
            parse_section() {
              awk -v anchor="$1" '{
                if (found) {
                  if (index($0, "<h4>") > 0) { exit }
                  buf = buf $0
                  next
                }
                if (index($0, anchor) > 0) {
                  found = 1
                  rest = substr($0, index($0, anchor))
                  e = index(rest, "<h4>")
                  buf = (e > 0) ? substr(rest, 1, e - 1) : rest
                }
              }
              END {
                if (found && match(buf, /nginx-[0-9]+\.[0-9]+\.[0-9]+/))
                  print substr(buf, RSTART + 6, RLENGTH - 6)
              }' /tmp/download.html
            }
            VER=$(parse_section "Stable version")
            MAINLINE=$(parse_section "Mainline version")
            echo "官方 Mainline(仅参考, 不跟踪): ${MAINLINE:-unknown}"
            if [ -z "${VER}" ]; then
              echo "::error::无法从 nginx.org 解析出 Stable version 区块版本号"
              exit 1
            fi
            if [ "${VER}" = "${MAINLINE}" ]; then
              echo "::error::解析异常: Stable 与 Mainline 版本号相同 (${VER}), 拒绝构建"
              exit 1
            fi
            echo "检测到官方最新 Stable 版本: ${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          # ---- 官方 stable yum 仓库包存在性校验 (构建前确认双架构 rpm 齐全) ----
          # 包文件名中的 "+" 会被 URL 编码为 %2B (如 nginx-module-otel-1.30.8+0.1.2-...)
          # verify_rpm: 3 次重试拉取仓库列表做 grep; 主包另有 HEAD 请求兜底
          #   (release 号惯例为 -1, 如 nginx-1.30.8-1.el8.ngx.x86_64.rpm)
          verify_rpm() { # $1=arch  $2=ere pattern  $3=allow_head_fallback(true/false)
            local arch="$1" pat="$2" allow_head="$3" attempt list code
            for attempt in 1 2 3; do
              list=$(curl -fsSL --retry 5 --retry-all-errors --max-time 60 \
                      "https://nginx.org/packages/centos/8/${arch}/RPMS/" 2>/dev/null || true)
              if [ -n "${list}" ] && echo "${list}" | grep -qE "${pat}"; then
                return 0
              fi
              if [ "${allow_head}" = "true" ]; then
                code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-all-errors \
                        --max-time 30 -I \
                        "https://nginx.org/packages/centos/8/${arch}/RPMS/nginx-${VER}-1.el8.ngx.${arch}.rpm" \
                        2>/dev/null || echo "000")
                [ "${code}" = "200" ] && return 0
              fi
              echo "  第 ${attempt} 次校验未命中 (arch=${arch}), 列表字节数: $(echo -n "${list}" | wc -c)"
              sleep 5
            done
            return 1
          }

          BASE_STABLE=0
          OTEL_STABLE=0
          for arch in x86_64 aarch64; do
            if verify_rpm "${arch}" "nginx-${VER}-[0-9]+\.el8\.ngx\.${arch}\.rpm" "true"; then
              echo "✓ nginx ${VER} 主包存在: ${arch}"
            else
              echo "::error::nginx ${VER} 主包在官方 stable 仓库 ${arch} 架构下不存在 (已重试)"
              exit 1
            fi
            if verify_rpm "${arch}" "nginx-module-otel-${VER}%2B[0-9.]+-[0-9]+\.el8\.ngx\.${arch}\.rpm" "false"; then
              echo "✓ nginx-module-otel ${VER} 存在: ${arch}"
              OTEL_STABLE=$((OTEL_STABLE + 1))
            else
              echo "::warning::nginx-module-otel ${VER} 在官方 stable 仓库 ${arch} 架构下暂未发布"
            fi
          done
          # 主包双架构齐全 -> 构建 stable 变体; otel 模块双架构齐全 -> 构建 otel 变体
          [ "${OTEL_STABLE}" = "2" ] && BUILD_OTEL=true || BUILD_OTEL=false
          echo "build_stable=true" >> "$GITHUB_OUTPUT"
          echo "build_otel=${BUILD_OTEL}" >> "$GITHUB_OUTPUT"

          # ---- check-fair 变体: 源码 URL 可达性校验 (该变体为源码编译, 构建前确认三个源均可下载) ----
          BUILD_CHECK_FAIR=true
          for u in \
            "https://nginx.org/download/nginx-${VER}.tar.gz" \
            "https://codeload.github.com/yaoweibin/nginx_upstream_check_module/tar.gz/refs/heads/master" \
            "https://codeload.github.com/gnosek/nginx-upstream-fair/tar.gz/refs/heads/master"; do
            c=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-all-errors --max-time 30 -I "$u" 2>/dev/null || echo "000")
            if [ "$c" != "200" ] && [ "$c" != "302" ]; then
              echo "::warning::check-fair 源码不可达 (HTTP ${c}): ${u}"
              BUILD_CHECK_FAIR=false
            else
              echo "✓ check-fair 源可达 (HTTP ${c}): ${u}"
            fi
          done
          echo "build_check_fair=${BUILD_CHECK_FAIR}" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: check
        env:
          VER: ${{ steps.ver.outputs.version }}
          FORCE: ${{ inputs.force_build || 'false' }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" = "true" ]; then
            echo "强制构建模式, 跳过版本 tag 检查"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 用 git tag nginx-v<版本> 标记已构建过的版本; 已存在则跳过
          if git ls-remote --tags origin \
              | awk '{print $2}' \
              | grep -Fxq "refs/tags/nginx-v${VER}"; then
            echo "nginx-v${VER} 已构建过, 跳过"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "nginx-v${VER} 尚未构建, 需要构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # 2. 按变体 × 平台构建并推送单架构镜像
  # ------------------------------------------------------------------
  build-and-publish:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    needs: detect
    # 注意1: jobs.<job_id>.if 的 context 不含 matrix (用了会 "Unrecognized named-value"
    #        导致整个 workflow 文件无效, run 45611004212/45612474337 的教训)。
    #        variant 开关改由 steps 级 if (支持 matrix+needs) 配合 enabled_ref 实现。
    # 注意2: if 表达式必须单行 —— YAML 折叠标量(>-)对更深缩进的行会保留换行。
    # otel 变体仅在官方 stable 仓库已发布双架构 otel 模块时才构建 (enabled_ref 下推到步骤)。
    if: needs.detect.outputs.should_build == 'true' && github.repository_owner == 'blueapple168'
    # 只在本仓库跑, 避免 fork 后别人的 push 也触发构建/推送 ghcr。
    # 如需更稳的判定可换成数字 ID: github.repository_id == '<你的仓库数字ID>' (改名免疫)。
    runs-on: ${{ matrix.runner }}
    # 按目标平台选择 runner 架构, 全部原生构建, 不需要 QEMU:
    #   linux/amd64 -> ubuntu-latest (x64)
    #   linux/arm64 -> ubuntu-24.04-arm (arm64, public 仓库免费)
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, otel]
        platform: [linux/amd64, linux/arm64]
        include:
          # 变体 -> context / tag 后缀 / 浮动 tag / detect 输出开关名
          - variant: stable
            context: nginx-stable
            tag_suffix: -uos
            floating_tag: latest
            enabled_ref: build_stable
          - variant: otel
            context: nginx-stable-otel
            tag_suffix: -otel-uos
            floating_tag: otel-latest
            enabled_ref: build_otel
          # check-fair: 源码编译 upstream_check + upstream_fair (构建耗时较长)
          - variant: check-fair
            context: nginx-check-fair
            tag_suffix: -check-fair-uos
            floating_tag: check-fair-latest
            enabled_ref: build_check_fair
          # 平台 -> runner
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      # 不同 variant × platform 独立, 避免互相 cancel
      group: nginx-publish-uos-${{ matrix.variant }}-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VER: ${{ needs.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tag
        run: |
          set -eux
          # 最终 tag: ${VER}${tag_suffix}, 如 1.30.6-uos / 1.30.6-otel-uos
          tag="${VER}${{ matrix.tag_suffix }}"
          # 单平台临时 tag: ${tag}-<arch>, 由 merge-manifest job 合成 multi-arch manifest
          platform_arch="${{ matrix.platform }}"
          platform_arch="${platform_arch##*/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "arch=${platform_arch}" >> "$GITHUB_OUTPUT"
          echo "arch_tag=${tag}-${platform_arch}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.variant }} / ${{ matrix.platform }})
        id: build
        if: needs.detect.outputs[matrix.enabled_ref] == 'true'
        run: |
          set -eux
          ARCH_TAG='${{ steps.image-tag.outputs.arch_tag }}'
          echo "::group::Building variant=${{ matrix.variant }} platform=${{ matrix.platform }}"
          # 单平台构建, 推到带架构后缀的临时 tag; merge job 再合成 multi-arch manifest。
          # --metadata-file 收集本次构建的 digest, 供后续步骤引用。
          docker buildx build \
            --build-arg "OS_VERSION=20-1070a" \
            --build-arg "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE_REPO}:${ARCH_TAG}" \
            --metadata-file "${GITHUB_WORKSPACE}/buildx-${ARCH_TAG}.json" \
            --push \
            "${{ matrix.context }}"
          echo "::endgroup::"

          digest=$(jq -r '."containerimage.digest"' "${GITHUB_WORKSPACE}/buildx-${ARCH_TAG}.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "arch_tag=${ARCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::${IMAGE_REPO}:${ARCH_TAG} -> ${digest}"

      - name: Run CVE scan (Trivy)
        if: needs.detect.outputs[matrix.enabled_ref] == 'true'
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-type: 'image'
          scan-ref: '${{ env.IMAGE_REPO }}:${{ steps.image-tag.outputs.arch_tag }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          output: 'scan_report_nginx_${{ matrix.variant }}_${{ steps.image-tag.outputs.arch }}.txt'
          # exit-code '0': 扫描结果只作为报告产出, 不阻断发布 (由人工审查)。
          exit-code: '0'
          # 关键: 显式声明被扫描镜像的平台。action 内部会 docker pull + docker save,
          # 不指定平台时 docker 按 runner 架构解析 manifest, 扫 arm64 镜像会报
          #   no matching manifest for linux/amd64 in the manifest list entries
          trivy-env: |
            TRIVY_PLATFORM=${{ matrix.platform }}
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}

      - name: Upload CVE scan report
        if: always() && needs.detect.outputs[matrix.enabled_ref] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan_report_nginx_${{ matrix.variant }}_${{ steps.image-tag.outputs.arch }}.txt
          path: scan_report_nginx_${{ matrix.variant }}_${{ steps.image-tag.outputs.arch }}.txt
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 3. 把各平台推的 ${tag}-amd64 / ${tag}-arm64 合成 multi-arch manifest
  # ------------------------------------------------------------------
  merge-manifest:
    name: Merge manifest (${{ matrix.variant }})
    # always(): 某个变体的某个 arch 失败时, 不连带阻止其它变体的 manifest 合并
    if: ${{ always() && needs.build-and-publish.result != 'skipped' && github.repository_owner == 'blueapple168' }}
    needs: [detect, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, otel]
        include:
          - variant: stable
            tag_suffix: -uos
            floating_tag: latest
          - variant: otel
            tag_suffix: -otel-uos
            floating_tag: otel-latest
          - variant: check-fair
            tag_suffix: -check-fair-uos
            floating_tag: check-fair-latest
    env:
      VER: ${{ needs.detect.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -eux
          image_tag="${VER}${{ matrix.tag_suffix }}"

          # 逐个确认两个 arch tag 均已推送成功; 缺任一则跳过本变体的合并
          # (另一个变体的 merge 仍会正常执行, 因为 job 之间相互独立)
          missing=0
          for arch in amd64 arm64; do
            if ! docker buildx imagetools inspect "${IMAGE_REPO}:${image_tag}-${arch}" >/dev/null 2>&1; then
              echo "::warning::${IMAGE_REPO}:${image_tag}-${arch} 不存在 (该平台构建可能失败), 跳过合并"
              missing=1
            fi
          done
          if [ "${missing}" = "1" ]; then
            echo "::notice::variant=${{ matrix.variant }} 缺少平台镜像, 未生成 multi-arch manifest"
            exit 0
          fi

          # 合成 linux/amd64 + linux/arm64 的 manifest list 到版本 tag 和浮动 tag
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:${image_tag}" \
            --tag "${IMAGE_REPO}:${{ matrix.floating_tag }}" \
            "${IMAGE_REPO}:${image_tag}-amd64" \
            "${IMAGE_REPO}:${image_tag}-arm64"
          echo "::notice::multi-arch manifest published: ${IMAGE_REPO}:${image_tag} (+ ${{ matrix.floating_tag }})"
          docker buildx imagetools inspect "${IMAGE_REPO}:${image_tag}"

  # ------------------------------------------------------------------
  # 4. 构建成功后打 nginx-v<版本> tag, 下次定时检测即跳过该版本
  # ------------------------------------------------------------------
  tag-release:
    name: Tag nginx-v${{ needs.detect.outputs.version }}
    needs: [detect, merge-manifest]
    if: needs.detect.outputs.should_build == 'true' && github.repository_owner == 'blueapple168'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create version tag
        env:
          VER: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "nginx-v${VER}" -m "nginx stable ${VER} (nginx-stable + nginx-stable-otel, amd64/arm64)"
          git push origin "nginx-v${VER}"
          echo "::notice::tagged nginx-v${VER}"
